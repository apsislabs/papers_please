name: Test & Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ['4.0', '3.4', '3.3']

    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Install dependencies
        run: bundle install
      - name: Rubocop
        run: rubocop
      - name: Run tests
        run: bundle exec rake
